# The test tier: the converter unit suite and the Playwright end-to-end run.
#
# This is the workflow that actually covers the app. Everything the page does —
# conversion, validation, the redirect, the language switch — happens in the
# browser, so a build-and-serve check cannot see any of it (smoke.yml says so
# itself). The end-to-end suite also carries the guard on media-query dark mode,
# which is the one migration hazard that fails silently rather than loudly.
#
# Formatting, types and the plain build live in code-quality.yml, and route
# loading in smoke.yml. Nothing is duplicated here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit · end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bunfig.toml` scopes `bun test` to src/; the Playwright specs under e2e/
      # import @playwright/test and cannot run under bun:test, so they have
      # their own runner below.
      - name: Unit tests
        run: bun test

      # playwright.config.ts serves dist/ rather than building it, so the build
      # has to happen here. The suite therefore always runs against the real
      # static output — the same bytes the deploy publishes.
      - name: Build
        run: bun run build

      - name: Install browsers
        run: bunx --bun playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
