# Publish the built static site to GitHub Pages at https://yt.edbpede.net.
#
# The app is `output: "static"` with no adapter and no server, so the deployable
# artefact is exactly `dist/`. peaceiris/actions-gh-pages force-pushes that
# directory to the `gh-pages` branch and writes the CNAME file on every run,
# which is why the custom domain survives a redeploy instead of being reset.
#
# Quality, smoke and test gates run on the pull request that produced the commit;
# this workflow deliberately does not re-run them, it publishes what landed.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Least privilege, stated explicitly rather than inherited from the repository
# default (currently "write"). peaceiris/actions-gh-pages pushes the built site
# to the gh-pages branch using GITHUB_TOKEN, which needs contents: write and
# nothing else.
permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`:
          # a deploy must build with the same toolchain the gates validated.
          bun-version-file: package.json

      # `--frozen-lockfile` rather than a plain install: installs exactly what
      # bun.lock pins instead of quietly resolving newer versions at deploy time,
      # and fails loudly if the lockfile is out of step with package.json.
      # Matches code-quality.yml, tests.yml and smoke.yml.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: yt.edbpede.net
