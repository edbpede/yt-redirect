# Code quality gate: Biome (format + lint), Astro type check, unit tests, build.
#
# The `biome-migrate` job exists so Renovate's grouped "biome" PRs can carry the
# config migration a new Biome release may require: it runs the repo-local
# `biome migrate`, commits the result as the GitHub Actions bot, and pushes back
# to the same Renovate branch. It is the ONLY job granted `contents: write`, and
# its `if:` restricts it to Renovate branches in this repository — ordinary and
# forked pull requests can never reach the write path.
name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the migrate job opts into write for itself alone.
permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome-migrate:
    name: Auto-migrate Biome config (Renovate only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repository Renovate pull requests only. The fork comparison keeps a
    # forked PR from ever being granted the write token below.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          # Check out the branch itself (not the detached merge commit) so the
          # migration commit can be pushed back to the Renovate branch.
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # No committed Node version file in this repo; pinned explicitly to
          # an LTS release rather than tracking `latest`.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npx biome` resolves the @biomejs/biome devDependency from node_modules,
      # so the migration runs on the exact version Renovate just bumped to.
      - name: Migrate Biome configuration
        run: npx biome migrate --write

      # Allowed to modify files. `continue-on-error` (not `|| true`) keeps a
      # genuine failure visible in the UI while still letting the commit step
      # capture whatever was fixed; the gate is the non-writing check below.
      - name: Apply Biome formatting and safe fixes
        continue-on-error: true
        run: npx biome check --write .

      - name: Commit and push migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --staged --quiet; then
            echo "Biome configuration already current — nothing to commit."
          else
            git commit -m "chore: auto-migrate biome config"
            git push
          fi

      # Authoritative, non-writing verification. Failures here fail the job.
      - name: Verify Biome check passes
        run: npx biome ci .

  quality:
    name: Format · lint · types · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [biome-migrate]
    # `always() && !failure() && !cancelled()` runs this job when biome-migrate
    # is SKIPPED (the normal case), because a skipped dependency would otherwise
    # cascade and skip the entire quality gate. A genuine migrate failure still
    # stops this job.
    if: ${{ always() && !failure() && !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On a Renovate PR this picks up the migration commit pushed above.
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome format and lint check
        run: npx biome ci .

      - name: Astro type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
